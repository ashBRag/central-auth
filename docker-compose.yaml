services:
  api:
    image: central-auth-api
    build:
      context: ./
      target: dev
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
      - /app/libs/prisma/src/generated
      - /app/dist
    ports:
      - "${PORT}:3001"
    env_file:
      - ../../Dev Arsenal/Infrastructure/dev-stack/.env
      - .env.${APP_ENV:-development}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure
    networks:
      - backend-internal

networks:
  backend-internal:
    external: true
